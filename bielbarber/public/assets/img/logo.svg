<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente Metálico Prateado Premium -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E5E5E5"/>
      <stop offset="60%" stop-color="#A3A3A3"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>

    <!-- Gradiente Escuro de Fundo -->
    <radialGradient id="badgeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F1F1F"/>
      <stop offset="70%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>

    <!-- Filtro de Sombra Suave -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fundo Circular com borda estilizada -->
  <circle cx="250" cy="250" r="235" fill="url(#badgeBg)" stroke="url(#silverGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="250" cy="250" r="218" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Tesoura Estilizada Cruzada (Ícone Tradicional da Barbearia) -->
  <g id="scissors" transform="translate(250, 155)" stroke="url(#silverGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Lâmina Esquerda -->
    <path d="M-55,-40 L35,50" />
    <circle cx="-65" cy="-50" r="16" stroke-width="6"/>
    <!-- Lâmina Direita -->
    <path d="M55,-40 L-35,50" />
    <circle cx="65" cy="-50" r="16" stroke-width="6"/>
    <!-- Parafuso Central -->
    <circle cx="0" cy="5" r="5" fill="#E0E0E0" stroke="#121212" stroke-width="2"/>
    <!-- Navalhete Minimalista Central -->
    <path d="M-22,35 L22,35 L12,48 L-12,48 Z" fill="url(#silverGrad)" stroke="none"/>
  </g>

  <!-- Pente e Estrelas de Excelência -->
  <g fill="url(#silverGrad)">
    <!-- 5 Estrelas -->
    <polygon points="250,225 254,236 266,236 256,243 260,254 250,247 240,254 244,243 234,236 246,236" transform="translate(0, 0) scale(0.7) translate(107, 70)"/>
    <polygon points="250,225 254,236 266,236 256,243 260,254 250,247 240,254 244,243 234,236 246,236" transform="translate(-32, 4) scale(0.55) translate(204, 180)"/>
    <polygon points="250,225 254,236 266,236 256,243 260,254 250,247 240,254 244,243 234,236 246,236" transform="translate(32, 4) scale(0.55) translate(204, 180)"/>
  </g>

  <!-- Tipografia Principal: BIEL CORTES -->
  <text x="250" y="325" 
        text-anchor="middle" 
        font-family="'Bebas Neue', 'Impact', sans-serif" 
        font-size="64" 
        letter-spacing="5" 
        fill="url(#silverGrad)"
        filter="url(#glow)">
    BIEL CORTES
  </text>

  <!-- Faixa Divisória Decorativa Metálica -->
  <line x1="120" y1="345" x2="380" y2="345" stroke="url(#silverGrad)" stroke-width="2" />
  <circle cx="250" cy="345" r="4" fill="#FFFFFF"/>

  <!-- Subtítulo e Tradição -->
  <text x="250" y="375" 
        text-anchor="middle" 
        font-family="'Inter', sans-serif" 
        font-weight="700" 
        font-size="14" 
        letter-spacing="6" 
        fill="#A3A3A3">
    BARBEARIA EXCLUSIVA
  </text>

  <!-- Slogan Curvado ou Base -->
  <text x="250" y="415" 
        text-anchor="middle" 
        font-family="'Inter', sans-serif" 
        font-weight="500" 
        font-size="12" 
        letter-spacing="2" 
        fill="#757575">
    ESTILO &bull; PRECISÃO &bull; PONTUALIDADE
  </text>
</svg>

